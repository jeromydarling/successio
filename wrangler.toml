name = "successio"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
CF_AI_GATEWAY_ID = "successio-prod"

[[d1_databases]]
binding = "DB"
database_name = "successio-prod"
database_id = "YOUR_D1_ID"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "successio-documents"

[[vectorize]]
binding = "VECTORS"
index_name = "successio-docs"

[[queues.producers]]
queue = "document-jobs"
binding = "DOCUMENT_QUEUE"

[[queues.consumers]]
queue = "document-jobs"
max_batch_size = 10
max_retries = 3

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PROCESSING_STATE"
class_name = "ProcessingStateDO"

[[durable_objects.bindings]]
name = "DEAL_ROOM"
class_name = "DealRoomDO"

[[workflows]]
name = "document-pipeline"
binding = "DOCUMENT_WORKFLOW"
class_name = "DocumentPipeline"
