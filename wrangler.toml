name = "successio"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom entry composes the OpenNext fetch handler with the Queue consumer,
# Email Worker, Durable Objects, and Workflow (see worker.ts).
main = "worker.ts"

# Custom domains (successio.pro + www.successio.pro) are managed in the
# Cloudflare dashboard (Workers → successio → Domains & Routes), so they are
# intentionally NOT declared here — declaring them makes `wrangler deploy` try
# to recreate them and fail with a conflict. The www → apex 301 redirect is
# handled in worker.ts and works regardless of how the domain is attached.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Sentry needs two env vars (NOT declared here):
#   - SENTRY_DSN: encrypted Worker secret (already set via the CF dashboard) —
#     consumed by worker.ts (withSentry) and the Next server/edge runtimes.
#   - NEXT_PUBLIC_SENTRY_DSN: must be a Plaintext *build* variable in CF Workers
#     Builds, since Next bakes NEXT_PUBLIC_* into the client bundle at build time.
[vars]
ENVIRONMENT = "production"
CF_AI_GATEWAY_ID = "successio-prod"
CF_ACCOUNT_ID = "f84f7181c051be0040e972dcad48e697"
APP_URL = "https://successio.pro"
EMAIL_FROM = "Successio <noreply@successio.pro>"
# Signup sends a confirm-email link and creates the account unverified.
# Verification is soft (the app still works; settings shows a nag until
# confirmed) — but registering an address you don't own now gets flagged.
EMAIL_VERIFICATION = "on"

# Cloudflare Email Sending — native binding (no secrets). successio.pro is
# onboarded + DNS-configured, so this sends from @successio.pro to any recipient.
[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "successio-prod"
database_id = "e27ac08e-d900-4d62-b5c2-4540f369636d"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "successio-documents"

# Semantic search over document chunks (index: 768-dim, cosine — bge-base-en-v1.5).
# The CI workflow creates this index before deploy (token has Vectorize:Edit).
[[vectorize]]
binding = "VECTORS"
index_name = "successio-docs"

[[kv_namespaces]]
binding = "SESSIONS"
id = "8c591cc451af4dadad6072e67ba401df"

# Browser Rendering — enables scanned-PDF OCR (rasterize pages → vision model).
# The OCR path auto-detects env.BROWSER; if the binding ever fails at runtime,
# scanned PDFs degrade gracefully to "needs review" instead of erroring.
[browser]
binding = "BROWSER"

[[queues.producers]]
queue = "document-jobs"
binding = "DOCUMENT_QUEUE"

[[queues.consumers]]
queue = "document-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "document-jobs-dlq"

# Dead-letter consumer: jobs that exhausted retries land here and are marked
# failed in D1, so the vault shows "processing failed — retry" instead of a
# document stuck on "queued" forever.
[[queues.consumers]]
queue = "document-jobs-dlq"
max_batch_size = 10
max_retries = 1

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PROCESSING_STATE"
class_name = "ProcessingStateDO"

[[durable_objects.bindings]]
name = "DEAL_ROOM"
class_name = "DealRoomDO"

[[workflows]]
name = "document-pipeline"
binding = "DOCUMENT_WORKFLOW"
class_name = "DocumentPipeline"

# Churn prevention cron — fires daily at 08:00 UTC.
[triggers]
crons = ["0 8 * * *"]

# Durable Object migration — required for the runtime to register the DO classes
# on first deploy. Both DOs are in-memory (no SQL storage) but use the modern
# SQLite-backed class declaration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProcessingStateDO", "DealRoomDO"]
