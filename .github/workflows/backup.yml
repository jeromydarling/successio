name: Nightly D1 backup

# Exports the production database every night and stores it in R2 under
# backups/ — the disaster-recovery answer to "one D1 instance, no rehearsed
# restore". Retention: R2 objects accumulate; prune manually or via lifecycle
# rules when needed. To restore: download the .sql file and run
#   npx wrangler d1 execute successio-prod --remote --file=backup.sql
# against a FRESH database, then repoint wrangler.toml (never restore over
# the live DB without a maintenance window).
#
# Requires CLOUDFLARE_API_TOKEN with D1:Edit + Workers R2 Storage:Edit.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export D1 and upload to R2
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          npx --yes wrangler@4 d1 export successio-prod --remote --output "db-$STAMP.sql"
          gzip "db-$STAMP.sql"
          npx --yes wrangler@4 r2 object put "successio-documents/backups/db-$STAMP.sql.gz" \
            --file "db-$STAMP.sql.gz" --remote
          echo "backup uploaded: backups/db-$STAMP.sql.gz ($(du -h db-$STAMP.sql.gz | cut -f1))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
