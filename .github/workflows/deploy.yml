name: Deploy

# Auto-deploy to Cloudflare Workers on every push to main.
# Requires one repo secret: CLOUDFLARE_API_TOKEN
#   (GitHub → repo Settings → Secrets and variables → Actions → New secret)
# Create the token at: Cloudflare dashboard → My Profile → API Tokens →
#   "Edit Cloudflare Workers" template (scoped to this account).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      # Create the Vectorize index the Worker binds to (idempotent — tolerates
      # "already exists"). Requires the token's Vectorize:Edit permission.
      - name: Ensure Vectorize index
        run: npx wrangler vectorize create successio-docs --dimensions=768 --metric=cosine || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Push runtime secrets onto the deployed Worker (idempotent — re-sets the
      # same value each run). Sessions are signed/verified with JWT_SECRET.
      - name: Sync JWT_SECRET
        run: printf '%s' "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
