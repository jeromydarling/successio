name: Deploy

# Auto-deploy to Cloudflare Workers on every push to main.
# Requires one repo secret: CLOUDFLARE_API_TOKEN
#   (GitHub → repo Settings → Secrets and variables → Actions → New secret)
# Create the token at: Cloudflare dashboard → My Profile → API Tokens →
#   "Edit Cloudflare Workers" template (scoped to this account).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # Integration tests: queue consumer + score engine against real D1
      # inside workerd (Miniflare) — hermetic, no cloud resources touched.
      - run: npm run test:integration
      # Create the Vectorize index the Worker binds to (idempotent — tolerates
      # "already exists"). Requires the token's Vectorize:Edit permission.
      - name: Ensure Vectorize index
        run: npx wrangler vectorize create successio-docs --dimensions=768 --metric=cosine || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Create the document-jobs queue if it doesn't exist. The Worker consumer
      # binding references this queue name — it must exist before wrangler deploy.
      - name: Ensure document-jobs queues
        run: |
          npx wrangler queues create document-jobs || true
          npx wrangler queues create document-jobs-dlq || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Apply any pending D1 schema migrations before the new Worker code goes
      # live. Running before deploy ensures the schema is ready when code runs.
      # Requires the token to have the "D1: Edit" permission — if it doesn't,
      # warn loudly and continue (apply the migration through another channel)
      # rather than blocking every deploy.
      - name: Apply D1 migrations
        run: |
          if ! npx wrangler d1 migrations apply successio-prod --remote; then
            echo "::warning::D1 migrations could not be applied — the CLOUDFLARE_API_TOKEN likely lacks the 'D1: Edit' permission (Cloudflare dashboard → My Profile → API Tokens). Pending migrations must be applied manually until it's added."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Push runtime secrets onto the deployed Worker (idempotent — re-sets the
      # same value each run). Add the matching secret to:
      #   GitHub → repo Settings → Secrets and variables → Actions
      - name: Sync required secrets
        run: |
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          if [ -n "$SUPER_ADMIN_TOKEN" ]; then
            printf '%s' "$SUPER_ADMIN_TOKEN" | npx wrangler secret put SUPER_ADMIN_TOKEN
          else
            echo "::warning::SUPER_ADMIN_TOKEN repo secret not set — /superadmin stays locked until it is"
          fi
          if [ -n "$E2E_ADMIN_TOKEN" ]; then
            printf '%s' "$E2E_ADMIN_TOKEN" | npx wrangler secret put E2E_ADMIN_TOKEN
          else
            echo "::warning::E2E_ADMIN_TOKEN repo secret not set — E2E seed/purge endpoints stay disabled"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_TOKEN: ${{ secrets.SUPER_ADMIN_TOKEN }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
      # Optional keys — only synced if the repo secret is set. Connectors and
      # external AI providers each light up automatically once their key lands
      # (modelsFor() upgrades extraction/profile routing; Mistral OCR becomes
      # the primary scanned-PDF path).
      - name: Sync optional keys (connectors + AI providers)
        run: |
          sync() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; else echo "skip $1 (not set)"; fi; }
          sync DROPBOX_APP_KEY "$DROPBOX_APP_KEY"
          sync GOOGLE_PICKER_API_KEY "$GOOGLE_PICKER_API_KEY"
          sync GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID"
          sync MS_CLIENT_ID "$MS_CLIENT_ID"
          sync MS_TENANT_ID "$MS_TENANT_ID"
          sync ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          sync MISTRAL_API_KEY "$MISTRAL_API_KEY"
          sync GOOGLE_AI_API_KEY "$GOOGLE_AI_API_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
