name: Deploy

# Auto-deploy to Cloudflare Workers on every push to main.
# Requires one repo secret: CLOUDFLARE_API_TOKEN
#   (GitHub → repo Settings → Secrets and variables → Actions → New secret)
# Create the token at: Cloudflare dashboard → My Profile → API Tokens →
#   "Edit Cloudflare Workers" template (scoped to this account).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # Integration tests: queue consumer + score engine against real D1
      # inside workerd (Miniflare) — hermetic, no cloud resources touched.
      - run: npm run test:integration
      # Create the Vectorize index the Worker binds to (idempotent — tolerates
      # "already exists"). Requires the token's Vectorize:Edit permission.
      - name: Ensure Vectorize index
        run: npx wrangler vectorize create successio-docs --dimensions=768 --metric=cosine || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Create the document-jobs queue if it doesn't exist. The Worker consumer
      # binding references this queue name — it must exist before wrangler deploy.
      - name: Ensure document-jobs queues
        run: |
          npx wrangler queues create document-jobs || true
          npx wrangler queues create document-jobs-dlq || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Apply any pending D1 schema migrations before the new Worker code goes
      # live. Running before deploy ensures the schema is ready when code runs.
      # Requires the token to have the "D1: Edit" permission — if it doesn't,
      # warn loudly and continue (apply the migration through another channel)
      # rather than blocking every deploy.
      - name: Apply D1 migrations
        run: |
          # Diagnostics for the persistent 7403: hit the D1 API directly with
          # the token and print Cloudflare's FULL error envelope (wrangler
          # swallows the inner error chain that names the missing permission).
          # These bodies contain no secrets — only success flags and errors.
          echo "— D1 list probe:"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/f84f7181c051be0040e972dcad48e697/d1/database?per_page=1" \
            | head -c 900; echo
          echo "— D1 query probe (SELECT 1 — mirrors the failing wrangler call):"
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"sql":"SELECT 1"}' \
            "https://api.cloudflare.com/client/v4/accounts/f84f7181c051be0040e972dcad48e697/d1/database/e27ac08e-d900-4d62-b5c2-4540f369636d/query" \
            | head -c 900; echo
          echo "— token verify (id + status of the token actually in the secret):"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 500; echo
          if ! npx wrangler d1 migrations apply successio-prod --remote; then
            echo "::warning::D1 migrations could not be applied — see the API probe output above for Cloudflare's exact error. Pending migrations must be applied manually until this is resolved."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
      # Push runtime secrets onto the deployed Worker in ONE bulk operation.
      # (Sequential `wrangler secret put` calls each create + deploy a Worker
      # version; rapid puts race each other and fail with "latest version of
      # your Worker isn't currently deployed". `secret bulk` writes them all
      # as a single version.) Unset repo secrets are skipped — each connector
      # or AI provider lights up automatically once its key is added.
      - name: Sync Worker secrets (bulk)
        run: |
          python3 - <<'PY'
          import json, os
          keys = [
            "JWT_SECRET", "SUPER_ADMIN_TOKEN", "E2E_ADMIN_TOKEN",
            "DROPBOX_APP_KEY", "GOOGLE_PICKER_API_KEY", "GOOGLE_OAUTH_CLIENT_ID",
            "MS_CLIENT_ID", "MS_TENANT_ID",
            "ANTHROPIC_API_KEY", "MISTRAL_API_KEY", "GOOGLE_AI_API_KEY",
          ]
          out = {}
          for k in keys:
              v = os.environ.get(k, "")
              if v:
                  out[k] = v
              else:
                  print(f"::notice::skip {k} (repo secret not set)", flush=True)
          for required in ("JWT_SECRET", "SUPER_ADMIN_TOKEN", "E2E_ADMIN_TOKEN"):
              if required not in out:
                  print(f"::warning::{required} repo secret not set — the feature it gates stays disabled", flush=True)
          with open("/tmp/worker-secrets.json", "w") as f:
              json.dump(out, f)
          PY
          ok=""
          for attempt in 1 2 3; do
            if npx wrangler secret bulk /tmp/worker-secrets.json; then ok=1; break; fi
            echo "secret bulk attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          rm -f /tmp/worker-secrets.json
          if [ -z "$ok" ]; then
            echo "::warning::Worker secret sync failed after 3 attempts — existing secret values remain in effect; re-run the workflow if a secret was rotated"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f84f7181c051be0040e972dcad48e697
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_TOKEN: ${{ secrets.SUPER_ADMIN_TOKEN }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
