name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (defaults to production)"
        required: false
        default: "https://successio.pro"

# Don't pile up overlapping runs on rapid pushes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # E2E and Deploy start simultaneously on push; testing production before
      # the new code (and its schema/secrets) lands causes races — wait for
      # the same-commit Deploy to finish so tests exercise what was shipped.
      - name: Wait for Deploy on this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
              | python3 -c "import json,sys; runs=[r for r in json.load(sys.stdin).get('workflow_runs',[]) if r['name']=='Deploy']; print(runs[0]['status'] if runs else 'none')")
            echo "deploy status: $status"
            if [ "$status" = "completed" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::Deploy didn't complete within 20 minutes — testing whatever is live"

      - name: Run E2E (desktop + mobile)
        run: npx playwright test --project=desktop --project=mobile
        env:
          # workflow_dispatch input wins; otherwise test production.
          BASE_URL: ${{ github.event.inputs.base_url || 'https://successio.pro' }}
          # Must match the Worker's E2E_ADMIN_TOKEN secret (synced by deploy.yml
          # from the same repo secret). No fallback — unset means the seed/purge
          # endpoints are disabled and the account-based specs will skip/fail.
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
          # Enables the superadmin CRM coverage test (skipped when unset).
          SUPER_ADMIN_TOKEN: ${{ secrets.SUPER_ADMIN_TOKEN }}

      # Belt-and-suspenders: purge any e2e+ accounts the test runners left
      # behind (happens when CI is killed before afterAll completes).
      # Targets only accounts older than 2 hours — safe to run mid-test-run.
      - name: Purge stale E2E accounts
        if: always()
        run: |
          curl -sf -X POST "${BASE_URL}/api/admin/purge-stale-e2e" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${E2E_ADMIN_TOKEN}\"}" || true
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://successio.pro' }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
