name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (defaults to production)"
        required: false
        default: "https://successio.pro"

# Don't pile up overlapping runs on rapid pushes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (desktop + mobile)
        run: npx playwright test --project=desktop --project=mobile
        env:
          # workflow_dispatch input wins; otherwise test production.
          BASE_URL: ${{ github.event.inputs.base_url || 'https://successio.pro' }}
          # Must match the Worker's E2E_ADMIN_TOKEN secret (synced by deploy.yml
          # from the same repo secret). No fallback — unset means the seed/purge
          # endpoints are disabled and the account-based specs will skip/fail.
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}

      # Belt-and-suspenders: purge any e2e+ accounts the test runners left
      # behind (happens when CI is killed before afterAll completes).
      # Targets only accounts older than 2 hours — safe to run mid-test-run.
      - name: Purge stale E2E accounts
        if: always()
        run: |
          curl -sf -X POST "${BASE_URL}/api/admin/purge-stale-e2e" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${E2E_ADMIN_TOKEN}\"}" || true
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://successio.pro' }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
